name: Publish Tidy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check JavaScript and task behavior
        run: |
          node --check web/core.js
          node --check web/assistant.js
          node --check web/app.js
          node --check web/calendar.js
          node --check web/planner.js
          node --check web/calendar-connect.js
          node --check web/calendar-auth.js
          node --check web/vendor/msal-browser.min.js
          node --check web/vendor/msal-redirect-bridge.min.js
          node --test tests/core.test.cjs tests/assistant.test.cjs tests/calendar.test.cjs tests/planner.test.cjs tests/calendar-connect.test.cjs
          python3 tools/check_inline_scripts.py web/index.html web/meals.html web/calendar-auth.html
          python3 -m unittest discover -s tests -p 'test_inline_scripts.py'
      - name: Build reviewed website files
        run: python3 tools/build_site.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/tidy-site"
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/tidy-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
